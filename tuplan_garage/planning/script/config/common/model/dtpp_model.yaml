_target_: tuplan_garage.planning.training.modeling.models.dtpp.dtpp_model.DTPPModel
_convert_: 'all'

encoder:
  _target_: tuplan_garage.planning.simulation.planner.dtpp_planner.scenario_tree_prediction.Encoder
  _convert_: 'all'
  dim: 256
  layers: 3
  heads: 8
  dropout: 0.1

decoder:
  _target_: tuplan_garage.planning.simulation.planner.dtpp_planner.scenario_tree_prediction.Decoder
  _convert_: 'all'
  neighbors: 10
  max_time: 8
  max_branch: 30
  n_heads: 8
  dim: 256
  variable_cost: False

future_trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  num_poses: 80      # target future poses
  interval_length: 0.1

past_trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  num_poses: 10      # target future poses
  interval_length: 0.1